<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    
    <!-- Router Body Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Antenna Metallic -->
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- LED Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Wi-Fi Radiation Waves (Upper Center) -->
  <g transform="translate(256, 175)" filter="url(#glow)">
    <!-- Outer Wave -->
    <path d="M -90,-45 A 100,100 0 0,1 90,-45" fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round" opacity="0.4" />
    <!-- Middle Wave -->
    <path d="M -60,-20 A 65,65 0 0,1 60,-20" fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round" opacity="0.75" />
    <!-- Inner Wave -->
    <path d="M -30,5 A 32,32 0 0,1 30,5" fill="none" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round" opacity="1" />
    <!-- Base Core Dot -->
    <circle cx="0" cy="25" r="7" fill="#38bdf8" />
  </g>

  <!-- Antennas -->
  <!-- Left Antenna -->
  <g transform="rotate(-18, 140, 290)">
    <rect x="134" y="100" width="12" height="190" rx="6" fill="url(#antennaGrad)" />
    <circle cx="140" cy="98" r="8" fill="#cbd5e1" />
    <rect x="131" y="270" width="18" height="20" rx="4" fill="#0f172a" />
  </g>

  <!-- Middle Antenna -->
  <g>
    <rect x="250" y="85" width="12" height="190" rx="6" fill="url(#antennaGrad)" />
    <circle cx="256" cy="83" r="8" fill="#cbd5e1" />
    <rect x="247" y="255" width="18" height="20" rx="4" fill="#0f172a" />
  </g>

  <!-- Right Antenna -->
  <g transform="rotate(18, 372, 290)">
    <rect x="366" y="100" width="12" height="190" rx="6" fill="url(#antennaGrad)" />
    <circle cx="372" cy="98" r="8" fill="#cbd5e1" />
    <rect x="363" y="270" width="18" height="20" rx="4" fill="#0f172a" />
  </g>

  <!-- Router Chassis Main Body (Modern Sleek Wedge) -->
  <!-- Shadow Under Chassis -->
  <ellipse cx="256" cy="405" rx="180" ry="24" fill="#000000" opacity="0.6" />

  <!-- Base Body -->
  <path d="M 80,335 L 115,275 L 397,275 L 432,335 L 412,385 L 100,385 Z" fill="url(#chassisGrad)" stroke="#475569" stroke-width="2" />

  <!-- Front Face Plate -->
  <path d="M 96,345 L 416,345 L 406,380 L 106,380 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ventilation / Accent Slot Lines -->
  <line x1="150" y1="300" x2="362" y2="300" stroke="#090d16" stroke-width="4" stroke-linecap="round" />
  <line x1="165" y1="312" x2="347" y2="312" stroke="#090d16" stroke-width="3" stroke-linecap="round" />

  <!-- LED Status Indicators (Front Panel) -->
  <!-- Power LED (Green) -->
  <circle cx="140" cy="362" r="4.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="140" cy="362" r="2" fill="#ecfdf5" />

  <!-- Internet WAN LED (Cyan Blue) -->
  <circle cx="180" cy="362" r="4.5" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="180" cy="362" r="2" fill="#f0fdfa" />

  <!-- 2.4GHz Wi-Fi LED (Cyan Blue) -->
  <circle cx="220" cy="362" r="4.5" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="220" cy="362" r="2" fill="#eff6ff" />

  <!-- 5GHz Wi-Fi LED (Cyan Blue) -->
  <circle cx="260" cy="362" r="4.5" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="260" cy="362" r="2" fill="#eff6ff" />

  <!-- LAN 1 LED (Green) -->
  <circle cx="300" cy="362" r="4.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="300" cy="362" r="2" fill="#ecfdf5" />

  <!-- LAN 2 LED (Green) -->
  <circle cx="340" cy="362" r="4.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="340" cy="362" r="2" fill="#ecfdf5" />

  <!-- WPS Lock LED (Amber) -->
  <circle cx="380" cy="362" r="4.5" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="380" cy="362" r="2" fill="#fffbeb" />

  <!-- Subtle Router Model Stamping / Text -->
  <text x="256" y="435" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4">WI-FI GATEWAY ADMIN</text>
</svg>
